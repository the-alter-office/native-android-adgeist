name: Artifact Deployment

on:
  push:
    branches: ["main", "dev"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish Artifacts to Maven Central
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Determine publish variant based on branch
        id: variant
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            VARIANT="qaRelease"
            SNAPSHOT="false"
          elif [ "$BRANCH" = "qa" ]; then
            VARIANT="qaRelease"
            SNAPSHOT="false"
          elif [ "$BRANCH" = "dev" ]; then
            VARIANT="betaRelease"
            SNAPSHOT="true"
          else
            echo "ERROR: No publish configuration for branch $BRANCH"
            exit 1
          fi

          echo "publish_variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "snapshot=$SNAPSHOT" >> $GITHUB_OUTPUT
          echo "Publishing variant: $VARIANT for branch: $BRANCH (snapshot: $SNAPSHOT)"

      - name: Extract version from gradle.properties
        id: version
        env:
          SNAPSHOT: ${{ steps.variant.outputs.snapshot }}
        run: |
          VERSION_NAME="$(
            grep '^VERSION_NAME=' gradle.properties \
              | cut -d'=' -f2- \
              | xargs
          )"

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: VERSION_NAME is missing from gradle.properties"
            exit 1
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: VERSION_NAME must be x.y.z, got $VERSION_NAME"
            exit 1
          fi

          if [ "$SNAPSHOT" = "true" ]; then
            VERSION="${VERSION_NAME}-beta-SNAPSHOT"
          else
            VERSION="$VERSION_NAME"
          fi

          echo "library_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current library version: $VERSION"

      - name: Check for duplicate version (fail early)
        if: steps.variant.outputs.snapshot != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARY_VERSION: ${{ steps.version.outputs.library_version }}
        run: |
          if gh release view "$LIBRARY_VERSION" >/dev/null 2>&1; then
            echo "ERROR: Version $LIBRARY_VERSION already exists as a GitHub Release."
            echo "Bump VERSION_NAME in gradle.properties."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin \
            "refs/tags/$LIBRARY_VERSION" >/dev/null 2>&1; then
            echo "ERROR: Git tag $LIBRARY_VERSION already exists."
            echo "Bump VERSION_NAME in gradle.properties."
            exit 1
          fi

          echo "Version is available: $LIBRARY_VERSION"

      - name: Import GPG key
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"

          printf '%s' "$SIGNING_PRIVATE_KEY" |
            gpg --batch --import

          gpg --list-secret-keys --keyid-format LONG

      - name: Test build locally
        id: test_build
        env:
          PUBLISH_VARIANT: ${{ steps.variant.outputs.publish_variant }}
        run: |
          echo "Building library locally to verify build integrity..."

          ./gradlew \
            :adgeistkit:assembleRelease \
            -PpublishVariant="$PUBLISH_VARIANT" \
            --no-daemon

          echo "Local build successful"

      - name: Create GitHub Release
        id: create_release
        if: steps.variant.outputs.snapshot != 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.library_version }}
          name: ${{ steps.version.outputs.library_version }}
          body: |
            AdgeistKit Android SDK version ${{ steps.version.outputs.library_version }}
          draft: false
          prerelease: false

      - name: Publish to Maven Central
        id: maven_publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          LIBRARY_VERSION: ${{ steps.version.outputs.library_version }}
          PUBLISH_VARIANT: ${{ steps.variant.outputs.publish_variant }}
        run: |
          echo "🚀 Publishing to Maven Central..."

          ./gradlew \
            :adgeistkit:publishAllPublicationsToMavenCentralRepository \
            -PVERSION_NAME="$LIBRARY_VERSION" \
            -PpublishVariant="$PUBLISH_VARIANT" \
            --no-daemon \
            --no-parallel

          echo "✅ Successfully published to Maven Central"

      # ==================== CLEANUP ON FAILURE ====================
      - name: Delete GitHub Release on deployment failure
        if: >-
          failure() &&
          steps.maven_publish.outcome == 'failure' &&
          steps.create_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARY_VERSION: ${{ steps.version.outputs.library_version }}
        run: |
          echo "Maven deployment failed. Deleting GitHub Release $LIBRARY_VERSION."

          gh release delete "$LIBRARY_VERSION" --yes ||
            echo "Release not found or already deleted"

      - name: Delete Git tag on deployment failure
        if: >-
          failure() &&
          steps.maven_publish.outcome == 'failure' &&
          steps.create_release.outcome == 'success'
        env:
          LIBRARY_VERSION: ${{ steps.version.outputs.library_version }}
        run: |
          echo "Deleting tag $LIBRARY_VERSION."

          git tag -d "$LIBRARY_VERSION" ||
            echo "Tag not found locally"

          git push origin --delete "$LIBRARY_VERSION" ||
            echo "Tag not found remotely"

      # ==================== SEND SLACK NOTIFICATION ====================
      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          LIBRARY_VERSION: ${{ steps.version.outputs.library_version }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: >-
            ${{ steps.variant.outputs.snapshot == 'true' && format('https://central.sonatype.com/repository/maven-snapshots/ai/adgeist/adgeistkit/{0}/maven-metadata.xml', steps.version.outputs.library_version) || 'https://central.sonatype.com/publishing/deployments' }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Deployment Succeeded"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Deployment Failed"
          fi

          MESSAGE="$(cat <<EOF
          *Kotlin (Android) Package Deployment Status*

          $STATUS_EMOJI *Status:* $STATUS_TEXT
          *Repository:* $REPOSITORY
          *Branch:* $BRANCH
          *Version:* ${LIBRARY_VERSION:-unknown}
          EOF
          )"

          PAYLOAD="$(
            jq -n \
              --arg text "$MESSAGE" \
              --arg workflowUrl "$WORKFLOW_URL" \
              --arg artifactUrl "$ARTIFACT_URL" \
              '{
                text: $text,
                workflowUrl: $workflowUrl,
                artifactUrl: $artifactUrl
              }'
          )"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
